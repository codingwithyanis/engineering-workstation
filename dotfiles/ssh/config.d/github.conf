# Identité Personnelle Principale
Host github-personal
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_personal
    IdentitiesOnly yes

Host gitlab-personal
    HostName gitlab.com
    User git
    IdentityFile ~/.ssh/id_ed25519_personal
    IdentitiesOnly yes

# Identité Personnelle Secondaire / Sys
Host github-sys
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_personal_sys
    IdentitiesOnly yes

Host gitlab-sys
    HostName gitlab.com
    User git
    IdentityFile ~/.ssh/id_ed25519_personal_sys
    IdentitiesOnly yes

# Identité Professionnelle
Host github-work
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_work
    IdentitiesOnly yes

Host gitlab-work
    HostName gitlab.com
    User git
    IdentityFile ~/.ssh/id_ed25519_work
    IdentitiesOnly yes
